name: Publish to GitHub Pages

# Pages is enabled with source = gh-pages branch (auto-provisioned by that
# branch's first push). This workflow mirrors main to gh-pages on every push,
# and GitHub's own pages-build-deployment then serves it. This avoids the
# configure-pages enablement API, which the workflow token cannot call.
# checkout is pinned to a full commit SHA (v4.4.0) per the 2026-09-02
# security review; the mirror push is a plain fast-forward (no --force).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages
